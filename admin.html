<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Redirect</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fb;
      color: #1f2430;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .dog-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .dog {
      position: absolute;
      font-size: 3.1rem;
      opacity: 0.26;
      filter: saturate(0.9);
      animation-name: walk-right;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }
    .dog.reverse {
      animation-name: walk-left;
    }
    @keyframes walk-right {
      0% { transform: translateX(-12vw) translateY(0); }
      100% { transform: translateX(112vw) translateY(0); }
    }
    @keyframes walk-left {
      0% { transform: translateX(112vw) scaleX(-1) translateY(0); }
      100% { transform: translateX(-12vw) scaleX(-1) translateY(0); }
    }
    .card {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border: 1px solid #e4e9f3;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(23, 34, 60, 0.08);
      position: relative;
      z-index: 2;
    }
    h1 { margin: 0 0 10px; font-size: 1.15rem; }
    .notice {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cfe0ff;
      background: #eef4ff;
      color: #2f3b55;
    }
    p { margin: 0 0 10px; line-height: 1.45; color: #465066; }
    a { color: #2f58d6; word-break: break-all; }
  </style>
</head>
<body>
  <div class="dog-field" id="dogField" aria-hidden="true"></div>
  <div class="card">
    <h1>Parcel Locator Admin has moved</h1>
    <p class="notice">
      Your username and password stay the same. We are making improvements and moving you to the updated admin experience.
    </p>
    <p>Redirecting you now...</p>
    <p>If you are not redirected, continue here:</p>
    <p><a id="manualLink" href="#">Open Admin</a></p>
  </div>
  <script>
    (function() {
      var dogField = document.getElementById("dogField");
      if (dogField) {
        var icons = ["🐕", "🐶", "🐩", "🦮", "🐕‍🦺"];
        for (var i = 0; i < 34; i++) {
          var d = document.createElement("span");
          d.className = "dog" + (Math.random() > 0.5 ? " reverse" : "");
          d.textContent = icons[i % icons.length];
          d.style.top = (Math.random() * 96) + "%";
          d.style.left = "-15vw";
          d.style.animationDuration = (14 + Math.random() * 20) + "s";
          d.style.animationDelay = "-" + (Math.random() * 25) + "s";
          d.style.fontSize = (2.8 + Math.random() * 2.8) + "rem";
          dogField.appendChild(d);
        }
      }

      var targetBase = "https://parcel-locator.me-ac4.workers.dev/admin";
      var dest = targetBase + (window.location.search || "");
      var manualLink = document.getElementById("manualLink");
      if (manualLink) manualLink.href = dest;
      setTimeout(function() {
        window.location.replace(dest);
      }, 15000);
    })();
  </script>
</body>
</html>
